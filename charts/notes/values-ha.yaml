# HA-shaped profile for the stateless tier.
# PostgreSQL stays single-instance: see README "Scope" for why.
api:
  replicaCount: 3
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      memory: 192Mi
postgres:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
backup:
  schedule: "17 */6 * * *"
  retention: 14
