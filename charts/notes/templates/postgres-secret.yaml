{{- if not .Values.postgres.existingSecret }}
{{- $name := include "notes.postgresSecretName" . }}
{{- $password := randAlphaNum 32 | b64enc }}
{{- /* Re-use the existing password on upgrade: regenerating it would lock the app out of an initialised data directory. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- if hasKey $existing.data "password" }}
{{- $password = index $existing.data "password" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Survives `helm uninstall` together with the data PVC, so a re-install can read the old data.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password }}
{{- end }}
